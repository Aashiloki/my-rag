# railway.toml — tells Railway how to build and run your app
# Railway reads this file automatically when you connect your repo.

[build]
builder    = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python main.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# The Python entry point reads Railway's injected PORT directly.
