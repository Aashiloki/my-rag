# railway.toml — tells Railway how to build and run your app
# Railway reads this file automatically when you connect your repo.

[build]
builder    = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand  = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# LEARNING: Railway injects $PORT automatically — do not hardcode 8000
# in the startCommand, Railway decides the port. The Dockerfile CMD is
# only used for local docker run; Railway overrides it with startCommand.
