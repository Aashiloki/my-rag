# render.yaml — tells Render how to deploy your app
# Alternative to Railway. Both have free tiers.
# Push this file to GitHub, connect repo on render.com, done.

services:
  - type: web
    name: my-rag
    runtime: docker
    dockerfilePath: ./Dockerfile

    # LEARNING: Render also injects $PORT — same pattern as Railway.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1

    envVars:
      - key: GROQ_API_KEY
        sync: false          # means: set this manually in Render dashboard
                             # NEVER commit your actual key to this file

    # Free tier: 512 MB RAM, spins down after 15 min inactivity
    # Enough for a portfolio project, cold start ~30 sec after inactivity
    plan: free
