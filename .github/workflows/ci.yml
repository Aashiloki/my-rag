name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Require Groq evaluation secret
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add GROQ_API_KEY as a repository Actions secret to run refusal evaluation."
            exit 1
          fi

      - name: Build local document index
        run: python -m app.ingest

      - name: Evaluate retrieval and refusal quality
        run: python eval/evaluate.py --min-hit-rate 70 --min-refusal-accuracy 100

      - name: Build Docker image
        run: docker build -t medicaps-rag:ci .